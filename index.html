<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12172e">
<title>Property Party — online board game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>window.Peer || document.write('<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"><\/script>')</script>
<style>
:root{
  --bg:#12172e; --panel:#1e2650; --panel2:#2a3468; --line:#3a4688; --ink:#f5f3ff; --muted:#aab2dc;
  --gold:#ffc93c; --pink:#ff5c8a; --mint:#36dcae; --sky:#5cc8ff; --red:#ff4d5e;
  --board:#fbf4e2; --bline:#2d2a3e; --felt1:#22b08f; --felt2:#0d6b63; --u:50px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-weight:700}
body{background:radial-gradient(1100px 700px at 5% -10%,#4b2fa955,transparent 60%),radial-gradient(900px 600px at 110% 15%,#ff5c8a2e,transparent 60%),radial-gradient(1000px 700px at 50% 120%,#22b08f30,transparent 60%),var(--bg);background-attachment:fixed;overflow-x:hidden}
h1,h2,h3,.btn,.f{font-family:'Fredoka',system-ui,sans-serif;font-weight:600;letter-spacing:.2px}
h2{margin:0 0 8px;font-size:24px} h3{margin:4px 0 10px;font-size:18px}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:0;border-radius:14px;padding:12px 18px;font-size:16px;cursor:pointer;color:#22183d;background:var(--gold);box-shadow:0 4px 0 #b9851a,0 8px 18px #0005;transition:transform .08s,box-shadow .08s,filter .15s;touch-action:manipulation;user-select:none;-webkit-user-select:none;white-space:nowrap}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b9851a,0 3px 8px #0005}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 4px 0 #b32857,0 8px 18px #0005}
.btn.mint{background:var(--mint);box-shadow:0 4px 0 #1b9675,0 8px 18px #0005}
.btn.sky{background:var(--sky);box-shadow:0 4px 0 #2a86b5,0 8px 18px #0005}
.btn.red{background:var(--red);color:#fff;box-shadow:0 4px 0 #a8202e,0 8px 18px #0005}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:0 4px 0 #141a3a,0 8px 18px #0004}
.btn.light{background:#ece6ff;color:#2a2050;box-shadow:0 3px 0 #b3a8d8}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:11px}
.btn.big{padding:15px 24px;font-size:20px;width:100%}
.btn:disabled{filter:grayscale(.85) brightness(.75);cursor:not-allowed;transform:none}
input,textarea,select{font:inherit;font-weight:700;color:var(--ink);background:#0e1330;border:2px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--sky)}
.card{background:linear-gradient(180deg,var(--panel),#19204a);border:1px solid #ffffff14;border-radius:22px;box-shadow:0 18px 44px #0007;padding:20px}
.lbl{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.8px}
.msg{min-height:20px;margin-top:12px;font-size:14px;color:var(--sky);text-align:center} .msg.err{color:#ff8a96}
/* swatches */
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid #ffffff30;cursor:pointer;position:relative;background:var(--c);box-shadow:inset 0 -4px 0 #0003,0 3px 8px #0005;transition:transform .12s}
.sw:hover{transform:scale(1.08)} .sw.sel{border-color:#fff;transform:scale(1.15);box-shadow:0 0 0 3px var(--c),0 4px 14px #0007}
.sw.sel::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:18px;text-shadow:0 1px 2px #0008}
.sw.taken{opacity:.22;cursor:not-allowed;transform:none;filter:grayscale(.6)}
.sw.taken::after{content:'✕';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:16px}
/* logo */
.logo{text-align:center;font-family:'Fredoka',system-ui,sans-serif;line-height:.92;user-select:none}
.logo .l1,.logo .l2{display:block;font-size:clamp(46px,11vw,76px);font-weight:700;letter-spacing:1px}
.logo .l1{color:var(--gold);text-shadow:0 5px 0 #b9851a,0 12px 26px #0008;transform:rotate(-3deg)}
.logo .l2{color:var(--pink);text-shadow:0 5px 0 #a8204e,0 12px 26px #0008;transform:rotate(2deg);margin-top:2px}
.logo .tag{margin-top:14px;color:var(--muted);font-size:15px;font-family:'Nunito'}
.logo.sm .l1,.logo.sm .l2{font-size:30px;text-shadow:0 3px 0 #0006}
/* home */
.screen{min-height:100dvh}
.home-wrap{max-width:460px;margin:0 auto;padding:clamp(20px,6vh,60px) 16px 30px;display:flex;flex-direction:column;gap:26px}
.home-actions{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.joinrow{display:flex;gap:8px} .joinrow input{text-transform:uppercase;letter-spacing:6px;text-align:center;font-family:'Fredoka',system-ui,sans-serif;font-size:20px}
.foot{text-align:center;color:var(--muted);font-size:13px;margin:0}
.resume{background:#2a3468;border-radius:14px;padding:10px 12px;margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
/* lobby */
.lobby-wrap{max-width:1180px;margin:0 auto;padding:16px}
.lobby-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.codebox{text-align:center} .codebox .code{font-family:'Fredoka',system-ui,sans-serif;font-size:44px;letter-spacing:10px;color:var(--gold);text-shadow:0 4px 0 #0006;line-height:1.1}
.lobby-grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:16px;align-items:start}
.lp{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;background:#ffffff0b;margin-bottom:8px;animation:pop .3s}
.lp .dot{width:34px;height:34px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-family:'Fredoka',system-ui,sans-serif;color:#fff;text-shadow:0 1px 2px #0007;box-shadow:inset 0 -3px 0 #0003;flex:none}
.lp .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp.empty{opacity:.4;border:2px dashed #ffffff22;background:none}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:#ffffff18;margin-left:6px;vertical-align:middle;font-family:'Nunito'}
.badge.host{background:var(--gold);color:#2b2000} .badge.you{background:var(--sky);color:#062033} .badge.bot{background:#8b7cf6;color:#fff} .badge.off{background:var(--red);color:#fff}
.kick{background:none;border:0;color:#ff8a96;font-size:18px;cursor:pointer;padding:4px 8px;border-radius:8px} .kick:hover{background:#ff4d5e22}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0;flex-wrap:wrap}
.seg{display:inline-flex;background:#0e1330;border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--muted);font:600 14px 'Fredoka',system-ui,sans-serif;padding:7px 11px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--sky);color:#062033}
.seg.ro button{cursor:default}
.namesum{background:#0e1330;border-radius:12px;padding:10px 12px;font-size:14px;margin:12px 0}
/* feeds */
.feed{height:260px;overflow-y:auto;background:#0d1230;border-radius:14px;padding:10px;font-size:14px;line-height:1.35;scrollbar-width:thin}
.feed .ln{padding:3px 0;border-bottom:1px solid #ffffff08;word-wrap:break-word}
.feed .ln.sys{color:var(--muted);font-style:italic}
.feed .ln b{font-family:'Fredoka',system-ui,sans-serif;font-weight:600}
.feed .ln .cdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.chatform{display:flex;gap:8px;margin-top:8px} .chatform input{padding:8px 10px}
/* game layout */
#game{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;padding:10px;height:100dvh}
#boardWrap{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
#side{display:flex;flex-direction:column;gap:10px;min-height:0}
.topbar{display:flex;align-items:center;gap:8px}
.topbar .room{flex:1;font-family:'Fredoka',system-ui,sans-serif;font-size:15px;background:var(--panel);border-radius:12px;padding:8px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .room b{color:var(--gold);letter-spacing:2px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:var(--panel2);color:var(--ink);font-size:18px;cursor:pointer;flex:none}
#plist{display:flex;flex-direction:column;gap:6px;overflow-y:auto;max-height:45vh;scrollbar-width:thin}
.pl{position:relative;display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;padding:8px 10px;background:var(--panel);border-radius:14px;border:2px solid transparent;cursor:pointer;overflow:hidden;transition:border-color .2s,background .2s}
.pl.turn{border-color:var(--c);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 28%,var(--panel)),var(--panel))}
.pl.bk{opacity:.42}
.pl .pdot{width:34px;height:34px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-family:'Fredoka',system-ui,sans-serif;color:#fff;box-shadow:inset 0 -3px 0 #0003;text-shadow:0 1px 2px #0007}
.pl .pname{font-family:'Fredoka',system-ui,sans-serif;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .pcash{font-family:'Fredoka',system-ui,sans-serif;font-size:18px;color:var(--mint)} .pl .pcash.neg{color:var(--red)}
.pchips{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;min-height:9px}
.pchips i{width:9px;height:9px;border-radius:2px;display:block;box-shadow:inset 0 0 0 1px #0004} .pchips i.m{opacity:.3}
.pl .pbar{position:absolute;left:0;bottom:0;height:3px;background:var(--c);transform-origin:left;width:100%}
.float{position:absolute;right:12px;top:4px;font-family:'Fredoka',system-ui,sans-serif;font-size:18px;pointer-events:none;animation:floatUp 1.4s ease-out forwards;text-shadow:0 2px 4px #000a}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;border:0;border-radius:12px;padding:8px;background:var(--panel);color:var(--muted);font:600 15px 'Fredoka',system-ui,sans-serif;cursor:pointer;position:relative}
.tabs button.on{background:var(--panel2);color:var(--ink)}
.tabs .unread{position:absolute;top:4px;right:10px;background:var(--pink);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px}
#side .feed{flex:1;height:auto;min-height:140px}
#banner{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:300;background:var(--red);color:#fff;padding:9px 16px;border-radius:12px;font-family:'Fredoka',system-ui,sans-serif;box-shadow:0 8px 20px #0008}
/* board */
#board{position:relative;width:var(--bw,600px);height:var(--bw,600px);border-radius:16px;background:var(--bline);box-shadow:0 0 0 5px #0a0e22,0 26px 60px #000b;user-select:none;-webkit-user-select:none;flex:none}
#grid{position:absolute;inset:0;display:grid;grid-template-columns:1.6fr repeat(9,1fr) 1.6fr;grid-template-rows:1.6fr repeat(9,1fr) 1.6fr;gap:1.5px;padding:2px;border-radius:16px;overflow:hidden}
.sp{position:relative;background:var(--board);display:flex;overflow:hidden;cursor:pointer;color:#2a2340;transition:background .2s}
.sp:hover{background:#fffbea}
.sp .band{flex:none;display:flex;align-items:center;justify-content:center;gap:1px}
.sp .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1px 2px;min-width:0;gap:1px}
.s-b,.s-t{flex-direction:column} .s-t{flex-direction:column-reverse}
.s-b .band,.s-t .band{height:24%;width:100%}
.s-l{flex-direction:row-reverse} .s-r{flex-direction:row}
.s-l .band,.s-r .band{width:24%;height:100%;flex-direction:column}
.sp .nm{font-size:calc(var(--u)*.155);line-height:1.08;font-family:'Nunito';font-weight:800;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word}
.sp .pr{font-size:calc(var(--u)*.17);font-family:'Fredoka',system-ui,sans-serif;color:#5c5470}
.sp .ic{font-size:calc(var(--u)*.36);line-height:1}
.tiny .sp .nm{display:none} .tiny .sp .ic{font-size:calc(var(--u)*.42)}
.sp .ownr{position:absolute;background:var(--oc);box-shadow:0 0 0 1px #0003}
.s-b .ownr{left:0;right:0;bottom:0;height:13%} .s-t .ownr{left:0;right:0;top:0;height:13%}
.s-l .ownr{top:0;bottom:0;left:0;width:13%} .s-r .ownr{top:0;bottom:0;right:0;width:13%}
.sp.owned{background:color-mix(in srgb,var(--oc) 13%,var(--board))}
.sp.mort .body{opacity:.35} .sp.mort::after{content:'MORTGAGED';position:absolute;inset:auto 0 40%;text-align:center;transform:rotate(-24deg);font:700 calc(var(--u)*.11) 'Fredoka',system-ui,sans-serif;color:#c02;letter-spacing:.5px}
.hs{width:calc(var(--u)*.17);height:calc(var(--u)*.17);background:#22c55e;border:1px solid #0b5d2a;border-radius:2px;box-shadow:inset 0 -2px 0 #0002}
.hs.hotel{width:calc(var(--u)*.36);background:#ef4444;border-color:#7f1010}
.s-l .hs.hotel,.s-r .hs.hotel{width:calc(var(--u)*.17);height:calc(var(--u)*.36)}
.hs.new{animation:popin .5s}
.corner{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:'Fredoka',system-ui,sans-serif;color:#2a2340}
.corner .big{font-size:calc(var(--u)*.5);line-height:1} .corner .cap{font-size:calc(var(--u)*.17);line-height:1.1;padding:0 3px}
.c-go{background:linear-gradient(135deg,#fff7d6,#ffe7a0)} .c-go .big{color:#e0384b;font-size:calc(var(--u)*.62)}
.c-jail{background:#fff2e2}
.c-jail .cell{position:absolute;top:0;right:0;width:68%;height:68%;background:#ffb547;border-left:2px solid var(--bline);border-bottom:2px solid var(--bline);display:grid;place-items:center;background-image:repeating-linear-gradient(90deg,transparent 0 16%,#3a2a1a 16% 21%)}
.c-jail .cell span{background:#fff8;border-radius:6px;padding:1px 4px;font-size:calc(var(--u)*.16)}
.c-jail .vis{position:absolute;left:3%;right:3%;bottom:4%;text-align:center;font-size:calc(var(--u)*.13);line-height:1;letter-spacing:.3px}
.sp.target{background:#fff1a8!important;z-index:3;animation:targetPulse 1s infinite}
.sp.near{background:#b8ffcf!important}
@keyframes targetPulse{0%,100%{box-shadow:inset 0 0 0 3px #ffb703,0 0 14px 4px #ffb70399}50%{box-shadow:inset 0 0 0 5px #ff8c00,0 0 24px 10px #ffb703cc}}
#centre{grid-row:2/11;grid-column:2/11;position:relative;background:radial-gradient(circle at 50% 40%,var(--felt1),var(--felt2));display:flex;align-items:flex-start;justify-content:center;overflow:hidden;padding-top:calc(var(--u)*1.85)}
#centre::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,#ffffff07 0 2px,transparent 2px 14px);pointer-events:none}
.ctitle{position:absolute;top:5%;left:0;right:0;text-align:center;font-family:'Fredoka',system-ui,sans-serif;font-weight:700;font-size:calc(var(--u)*.66);color:#fff;text-shadow:0 4px 0 #0b4f49,0 8px 20px #0006;pointer-events:none;transform:rotate(-2deg);letter-spacing:1px;line-height:1}
.ctitle small{display:block;font-size:.38em;color:#d6fff5;text-shadow:none;letter-spacing:3px;margin-top:4px}
.deck{position:absolute;width:calc(var(--u)*1.8);height:calc(var(--u)*1.15);border-radius:10px;display:grid;place-items:center;font-family:'Fredoka',system-ui,sans-serif;font-size:calc(var(--u)*.2);color:#fff;text-align:center;box-shadow:3px 3px 0 #0003,6px 6px 0 #0002,0 8px 16px #0004;pointer-events:none}
.deck.chance{left:7%;bottom:9%;background:linear-gradient(135deg,#ff9f1c,#ff5c8a);transform:rotate(-14deg)}
.deck.chest{right:7%;bottom:9%;background:linear-gradient(135deg,#4f8cff,#7b5cff);transform:rotate(12deg)}
.deck b{display:block;font-size:2em;line-height:1}
.pot{position:absolute;top:calc(5% + var(--u)*1.05);left:50%;transform:translateX(-50%);background:#0007;color:#ffe08a;border-radius:99px;padding:3px 10px;font-family:'Fredoka',system-ui,sans-serif;font-size:calc(var(--u)*.2);white-space:nowrap}
#panel{position:relative;z-index:2;width:min(88%,430px);background:#fffdf6f2;color:#241c40;border-radius:18px;padding:12px 14px 12px;box-shadow:0 10px 30px #0007;text-align:center}
#panel .who{display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Fredoka',system-ui,sans-serif;font-size:clamp(13px,calc(var(--u)*.27),18px);margin-bottom:4px}
#panel .who .pdot{width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:inset 0 -2px 0 #0003;flex:none}
#panel .prompt{font-size:clamp(12px,calc(var(--u)*.23),15px);color:#4a4166;margin:2px 0 8px}
#panel .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#panel .btn{font-size:clamp(13px,calc(var(--u)*.27),16px);padding:9px 14px}
#panel.busy .btn{pointer-events:none;opacity:.6}
.timer{display:flex;align-items:center;gap:8px;margin-top:10px}
.tbadge{width:32px;height:32px;border-radius:50%;background:#241c40;color:#fff;display:grid;place-items:center;font:700 15px 'Fredoka',system-ui,sans-serif;flex:none}
.tbar{flex:1;height:9px;border-radius:99px;background:#241c4022;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#36dcae);transform-origin:left;border-radius:99px}
.timer.warn .tbadge{background:var(--red);animation:tickPulse 1s infinite} .timer.warn .tbar i{background:var(--red)}
.timer.idle{opacity:.35}
@keyframes tickPulse{0%{transform:scale(1.25)}40%{transform:scale(1)}}
.mini-deed{display:inline-block;width:min(210px,80%);background:#fff;border:2px solid #241c40;border-radius:10px;overflow:hidden;margin:2px auto 8px;text-align:center;box-shadow:0 4px 12px #0003}
.mini-deed .hd{padding:6px 4px;color:#fff;font-family:'Fredoka',system-ui,sans-serif;font-size:15px;text-shadow:0 1px 2px #0006}
.mini-deed .bd{padding:5px;font-size:13px;color:#4a4166}
.gcard{width:min(250px,86%);margin:2px auto 8px;border-radius:14px;padding:12px;color:#fff;font-size:clamp(12px,calc(var(--u)*.24),15px);box-shadow:0 8px 18px #0004;animation:cardIn .7s cubic-bezier(.2,.9,.3,1.2)}
.gcard.chance{background:linear-gradient(135deg,#ff9f1c,#ff5c8a)} .gcard.chest{background:linear-gradient(135deg,#4f8cff,#7b5cff)}
.gcard .t{font-family:'Fredoka',system-ui,sans-serif;font-size:1.2em;margin-bottom:4px}
@keyframes cardIn{0%{transform:perspective(600px) rotateY(180deg) scale(.4) translateY(60%);opacity:0}60%{opacity:1}100%{transform:perspective(600px) rotateY(0) scale(1)}}
/* tokens */
#tokens,#fx,#diceLayer{position:absolute;inset:0;pointer-events:none}
.tok{position:absolute;width:calc(var(--u)*.5);height:calc(var(--u)*.5);margin:calc(var(--u)*-.25) 0 0 calc(var(--u)*-.25);border-radius:50%;background:radial-gradient(circle at 34% 28%,#ffffffb0,transparent 38%),var(--c);border:2.5px solid #fff;box-shadow:0 4px 0 #0004,0 6px 10px #0006;display:grid;place-items:center;font:700 calc(var(--u)*.24) 'Fredoka',system-ui,sans-serif;color:#fff;text-shadow:0 1px 2px #0009;z-index:5;transition:left .3s,top .3s;pointer-events:none}
.tok.can{pointer-events:auto;cursor:grab;touch-action:none;z-index:20;animation:bob 1s ease-in-out infinite;box-shadow:0 0 0 4px #fff,0 0 20px 8px var(--c),0 6px 10px #0006}
.tok.drag{pointer-events:auto;transition:none!important;animation:none;cursor:grabbing;z-index:60;transform:scale(1.3) translateY(-12%);box-shadow:0 0 0 4px #fff,0 16px 24px #0008}
.tok.jailed::after{content:'';position:absolute;inset:-3px;border-radius:50%;background:repeating-linear-gradient(90deg,transparent 0 5px,#222c 5px 8px)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-18%)}}
/* dice */
.die{position:absolute;width:calc(var(--u)*.66);height:calc(var(--u)*.66);margin:calc(var(--u)*-.33) 0 0 calc(var(--u)*-.33);z-index:40;pointer-events:none}
.die.can{pointer-events:auto;cursor:grab;touch-action:none}

    case 'card': sfx('card'); return;
    case 'bankrupt': { sfx('bust'); const p = cP(ev.pid); if (p) toast('💥 ' + p.name + ' is bankrupt!'); return; }
    case 'over': sfx('win'); return;

  const host = C.role !== 'client';
  $('#overBtns').innerHTML = (host ? `<button class="btn big" id="bAgain">🔁 Play again</button>` : `<p class="muted">Waiting for the host to start another game…</p>`) + `<button class="btn ghost sm" id="bOverLeave">Leave</button><button class="btn ghost sm" id="bOverBoard">See board</button>`;
  if (host) $('#bAgain').onclick = () => { sfx('click'); toHost({ t: 'again' }); };
  $('#bOverLeave').onclick = () => leaveRoom(); $('#bOverBoard').onclick = () => $('#over').classList.add('hidden');
}
function hideOver() { $('#over').classList.add('hidden'); $('#over')._v = null; UI.overShown = false; }
function confetti() {
  const cols = PCOLS.map(c => c.hex);
  for (let i = 0; i < 90; i++) { const d = document.createElement('div'); d.className = 'confetti'; d.style.left = Math.random() * 100 + 'vw'; d.style.background = cols[i % cols.length]; d.style.animationDuration = 2 + Math.random() * 2.5 + 's'; d.style.animationDelay = Math.random() * .8 + 's'; d.style.borderRadius = Math.random() < .5 ? '50%' : '2px'; document.body.appendChild(d); setTimeout(() => d.remove(), 5500); }
}

/* ---------- boot ---------- */
initHome(); initLobby(); initPointer(); requestAnimationFrame(timerLoop);
addEventListener('beforeunload', e => { if (C.role === 'host' && C.S && C.S.mode === 'game') { e.preventDefault(); e.returnValue = ''; } });
if (new URLSearchParams(location.search).get('debug') === '1') window.__pp = { C, H, UI };
</script>
